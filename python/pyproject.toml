[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dealcode"
version = "1.0.1"
description = "Collision-free, random-looking codes from a counter (FF1-based, NIST SP 800-38G)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Algorix Corporation" }]
keywords = ["ff1", "format-preserving-encryption", "id", "code", "sequence"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["cryptography>=41"]

[project.urls]
Documentation = "https://algorix-hq.github.io/dealcode/"
Homepage = "https://github.com/algorix-hq/dealcode"
Repository = "https://github.com/algorix-hq/dealcode"
Issues = "https://github.com/algorix-hq/dealcode/issues"
Specification = "https://github.com/algorix-hq/dealcode/blob/main/SPEC.md"

[dependency-groups]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/dealcode"]
