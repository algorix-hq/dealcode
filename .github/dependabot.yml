# Keep GitHub Actions and per-language dependencies patched.
# Runtime dependencies are deliberately minimal (platform/audited crypto
# only), so most churn here is dev/test tooling and action pins.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # MSRV pin: CI deliberately tests at the documented minimum (1.75)
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: monthly
    groups:
      js-deps:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: monthly
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: monthly
    groups:
      java-deps:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: monthly
    groups:
      go-deps:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    groups:
      docs-deps:
        patterns: ["*"]
        update-types: [minor, patch]
