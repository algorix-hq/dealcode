# Publish the Python package to PyPI via Trusted Publishing (OIDC).
#
# Prerequisite: a Trusted Publisher registered on PyPI for project
# "dealcode" with owner algorix-hq, repository dealcode, workflow
# publish-pypi.yml, environment pypi.
#
# Trigger: MANUAL ONLY (workflow_dispatch) — run from the Actions tab or
# `gh workflow run publish-pypi.yml --ref vX.Y.Z` (always dispatch against the tag).
name: publish-pypi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test before building
        run: |
          pip install ./python pytest
          python -m pytest python/tests -q
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build python/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/dealcode/
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
