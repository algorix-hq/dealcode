# Publish the Python package to PyPI via Trusted Publishing (OIDC).
#
# Prerequisite: a Trusted Publisher registered on PyPI for project
# "dealcode" with owner algorix-hq, repository dealcode, workflow
# publish-pypi.yml, environment pypi.
#
# Trigger: MANUAL ONLY (workflow_dispatch) — run from the Actions tab or
# `gh workflow run publish-pypi.yml` after the release commit is on main.
name: publish-pypi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test before building
        run: |
          pip install ./python pytest
          python -m pytest python/tests -q
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build python/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/dealcode/
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
