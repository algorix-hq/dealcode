# Publish the Rust crate to crates.io via Trusted Publishing (OIDC).
#
# Prerequisite: a Trusted Publisher configured on crates.io for the
# "dealcode" crate (crate page → Settings → Trusted Publishing):
# repository algorix-hq/dealcode, workflow publish-crates.yml,
# environment crates-io.
#
# Trigger: MANUAL ONLY (workflow_dispatch) — run from the Actions tab or
# `gh workflow run publish-crates.yml` after the release commit is on main.
name: publish-crates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/dealcode
    permissions:
      contents: read
      id-token: write  # OIDC token for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
