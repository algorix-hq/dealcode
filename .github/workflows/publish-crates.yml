# Publish the Rust crate to crates.io via Trusted Publishing (OIDC).
#
# Prerequisite: a Trusted Publisher configured on crates.io for the
# "dealcode" crate (crate page → Settings → Trusted Publishing):
# repository algorix-hq/dealcode, workflow publish-crates.yml,
# environment crates-io.
#
# Trigger: MANUAL ONLY (workflow_dispatch) — run from the Actions tab or
# `gh workflow run publish-crates.yml` after the release commit is on main.
name: publish-crates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/dealcode
    permissions:
      contents: read
      id-token: write  # OIDC token for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          toolchain: 1.85.0
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
